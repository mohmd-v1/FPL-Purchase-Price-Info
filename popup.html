<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPL Purchase Price Info</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <img src="icon48.png" alt="FPL Logo" class="logo-icon">
      <div class="title">FPL Price Info</div>
    </div>

    <div class="status-badge">
      <span class="pulse-dot"></span>
      <span>Active &amp; Connected</span>
    </div>

    <p class="description">
      Purchase price, selling price, profit/loss and predicted progress are automatically displayed when opening any squad player's profile.
    </p>

    <div class="footer">
      Version 2.2 • Powered by Official FPL API
    </div>
  </div>
</body>
</html>
